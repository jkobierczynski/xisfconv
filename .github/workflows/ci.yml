# SPDX-License-Identifier: LGPL-3.0-or-later
name: CI

# Every push and pull request: build and test on Linux, macOS and Windows.
# Pushing a tag like v0.3.2 additionally packages the binaries and publishes a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04        # older glibc (2.35) so the binary runs on more distributions
          - name: macos-arm64
            os: macos-14            # Apple Silicon
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libzstd-dev libtiff-tools fitsverify pngcheck libcfitsio-bin

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static zstd:x64-windows-static

      # XISFCONV_PORTABLE links zstd (and the C++ runtime where needed) statically, so the
      # binary that is tested here is exactly the one that gets released.
      - name: Configure
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              cmake -S . -B build -DXISFCONV_PORTABLE=ON -DXISFCONV_BUILD_TESTS=ON \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-windows-static ;;
            macOS)
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXISFCONV_PORTABLE=ON -DXISFCONV_BUILD_TESTS=ON \
                -DCMAKE_PREFIX_PATH="$(brew --prefix zstd)" ;;
            *)
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXISFCONV_PORTABLE=ON -DXISFCONV_BUILD_TESTS=ON ;;
          esac

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          if [ -f build/Release/xisfconv.exe ]; then echo "path=build/Release/xisfconv.exe" >> "$GITHUB_OUTPUT"
          else echo "path=build/xisfconv" >> "$GITHUB_OUTPUT"; fi

      - name: Show linked libraries
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ldd "${{ steps.bin.outputs.path }}" ;;
            macOS) otool -L "${{ steps.bin.outputs.path }}" ;;
          esac
          "${{ steps.bin.outputs.path }}" --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        shell: bash
        run: |
          pip install numpy astropy tifffile imagecodecs xisf lz4 zstandard pillow asdf asdf-astropy asdf-compression
          python tests/run_tests.py "${{ steps.bin.outputs.path }}"

      # The library seen from C: the header compiled by a C compiler, error paths, callbacks.
      # With --quiet the program prints nothing unless a check fails, so any output is the library's.
      - name: Test the C API
        shell: bash
        run: |
          dir="$(dirname "${{ steps.bin.outputs.path }}")"
          mkdir -p capi-files capi-quiet
          "$dir/xisfconv_capi_test" capi-files
          out="$("$dir/xisfconv_capi_test" capi-quiet --quiet 2>&1)"
          if [ -n "$out" ]; then echo "::error::the library printed: $out"; exit 1; fi

      # The example programs of the manual (docs/manual.html), in C and C++: built with the test
      # programs, run on a small file, and what they print and write is checked.
      - name: Test the examples of the manual
        shell: bash
        run: python tests/examples_test.py "$(dirname "${{ steps.bin.outputs.path }}")"

      # The shared library, called from Python through ctypes and compared with astropy,
      # the xisf package, asdf, tifffile and Pillow.
      - name: Build the shared library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              # XISFCONV_PORTABLE: the static C runtime, to match the x64-windows-static libraries
              cmake -S . -B build-shared -DBUILD_SHARED_LIBS=ON -DXISFCONV_PORTABLE=ON \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-windows-static ;;
            macOS)
              cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_PREFIX_PATH="$(brew --prefix zstd)" ;;
            *)
              cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON ;;
          esac
          cmake --build build-shared --config Release --parallel

      - name: Test the shared library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) lib=build-shared/Release/libxisfconv.dll; exe=build-shared/Release/xisfconv.exe ;;
            macOS)   lib=build-shared/libxisfconv.dylib; exe=build-shared/xisfconv ;;
            *)       lib=build-shared/libxisfconv.so; exe=build-shared/xisfconv ;;
          esac
          python tests/library_tests.py "$lib" "$exe"

      # The Python package, on that shared library: python/tests compares what it reads and
      # writes with the same other software, and its declarations with the header.
      - name: Test the Python package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) lib=build-shared/Release/libxisfconv.dll; exe=build-shared/Release/xisfconv.exe ;;
            macOS)   lib=build-shared/libxisfconv.dylib; exe=build-shared/xisfconv ;;
            *)       lib=build-shared/libxisfconv.so; exe=build-shared/xisfconv ;;
          esac
          pip install pytest
          XISFCONV_LIBRARY="$lib" XISFCONV_TOOL="$exe" PYTHONPATH=python python -m pytest python/tests

      - name: Check tag matches program version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$("${{ steps.bin.outputs.path }}" --version | head -1 | awk '{print $2}')"
          echo "tag: $want  binary: $have"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in include/xisfconv.h ($have)"
            exit 1
          fi

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="xisfconv-${GITHUB_REF_NAME#v}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "${{ steps.bin.outputs.path }}" README.md MANUAL.md LICENSE COPYING.LESSER THIRD-PARTY-NOTICES.md "dist/$pkg/"
          # previews in the file manager: the thumbnailer entry and the file types (see MANUAL.md)
          if [ "$RUNNER_OS" = "Linux" ]; then cp -r desktop "dist/$pkg/"; fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$pkg.zip" "$pkg" > /dev/null
          else tar czf "$pkg.tar.gz" "$pkg"; fi
          ls -la

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build              # only runs when every platform built and passed its tests
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: xisfconv ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
