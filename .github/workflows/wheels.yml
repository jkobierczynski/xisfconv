# SPDX-License-Identifier: LGPL-3.0-or-later
name: Wheels

# The Python package: one wheel per platform (it serves every Python 3, see pyproject.toml) and
# the source distribution. Each wheel is installed in a fresh environment and tested there.
# Started by a version tag, or by hand. Publishing to PyPI happens for a tag, and only once the
# repository variable PUBLISH_TO_PYPI is set to "true" (see "Releasing" in DEVELOPMENT.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The settings are in pyproject.toml ([tool.cibuildwheel]).
      - name: Build and test the wheel
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          ls wheelhouse
          if ! ls wheelhouse/xisfconv-"$want"-*.whl > /dev/null 2>&1; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in include/xisfconv.h"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*

      # the source distribution has to build a working package on its own
      - name: Install from it and test
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev libzstd-dev
          python -m pip install "$(ls dist/*.tar.gz)[test]"
          python -m pytest python/tests

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [wheels, sdist]      # only when every wheel was built and passed its tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write           # PyPI trusted publishing: no password or token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what is published
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
